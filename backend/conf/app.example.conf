appname = linkdock
httpport = 8080
httpaddr = 0.0.0.0
runmode = dev
autorender = false
copyrequestbody = true
EnableDocs = false

# 数据库配置，可选：sqlite, mysql
# 默认推荐使用 sqlite，适合本地开发和个人部署。
db_driver = sqlite
db_path = linkdock.db

# MySQL 配置，仅当 db_driver = mysql 时生效。
# 请勿在开源仓库中提交真实数据库密码。
db_user = root
db_pass = your_password
db_host = 127.0.0.1
db_port = 3306
db_name = linkdock
